[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "desktop-organizer-agent"
version = "0.1.0"
description = "A safe desktop file organization agent built step by step."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Luan-peixi" },
]
requires-python = ">=3.11"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "langgraph>=1.2,<2.0",
    "openai>=2.0,<3.0",
    "pydantic>=2.0",
    "pypdf>=6,<7",
    "python-docx>=1.2,<2.0",
    "streamlit>=1.61,<2.0",
]

[project.optional-dependencies]
dev = [
    "pillow>=10,<13",
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
desktop_agent = ["data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
